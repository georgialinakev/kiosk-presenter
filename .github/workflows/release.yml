name: Release

# Push a tag like v0.1.0 to build KioskPresenter-Setup-0.1.0.exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (test build, no release created)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Unit tests
        run: dotnet test tests/KioskPresenter.Core.Tests -c Release

      - name: Publish the kiosk app
        run: >
          dotnet publish src/KioskPresenter.Host -c Release -r win-x64
          -p:PublishSingleFile=true -p:Version=${{ env.VERSION }}
          -o out/payload/app

      - name: Build the Setup payload
        shell: pwsh
        run: |
          Copy-Item -Recurse ui out/payload/app/ui
          New-Item -ItemType Directory out/payload/demo | Out-Null
          Copy-Item tests/fixtures/*.pptx out/payload/demo/
          # Microsoft's WebView2 Evergreen bootstrapper (redistributable); Setup runs it only when the runtime is missing.
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile out/payload/MicrosoftEdgeWebview2Setup.exe
          Get-ChildItem out/payload -Recurse -Filter *.pdb | Remove-Item
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $PWD 'src/KioskPresenter.Setup/payload.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'out/payload'), $zip)
          Get-ChildItem out/payload -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "Payload: {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: Publish Setup
        run: >
          dotnet publish src/KioskPresenter.Setup -c Release -r win-x64
          -p:PublishSingleFile=true -p:Version=${{ env.VERSION }}
          -o out/setup

      - name: Name and hash
        shell: pwsh
        run: |
          $exe = "out/KioskPresenter-Setup-$env:VERSION.exe"
          Move-Item out/setup/KioskPresenter-Setup.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  $(Split-Path $exe -Leaf)" | Out-File "$exe.sha256" -Encoding ascii
          "SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskPresenter-Setup-${{ env.VERSION }}
          path: out/KioskPresenter-Setup-*

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-ChildItem out/KioskPresenter-Setup-*).FullName --title "Kiosk Presenter ${{ env.VERSION }}" --generate-notes
        shell: pwsh
