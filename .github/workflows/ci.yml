name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KioskPresenter.sln

      - name: Build
        run: dotnet build KioskPresenter.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/KioskPresenter.Core.Tests -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  ui:
    name: UI bridge tests (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Run UI tests
        run: |
          python3 -m http.server 8766 --directory ui > /dev/null 2>&1 &
          sleep 2
          node tests/ui/bridge-test.js
